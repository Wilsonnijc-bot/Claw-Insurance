x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile
  image: claw-insurance-local
  working_dir: /workspace
  environment:
    NANOBOT_PROJECT_ROOT: /workspace
    WEB_BROWSER_MODE: ${WEB_BROWSER_MODE-cdp}
    WEB_CDP_URL: ${WEB_CDP_URL-http://host.docker.internal:9222}
    WEB_CDP_HELPER_URL: ${WEB_CDP_HELPER_URL-http://host.docker.internal:9230}
    WEB_CDP_HELPER_TOKEN: ${WEB_CDP_HELPER_TOKEN-}
    WEB_CDP_HELPER_PLATFORM: ${WEB_CDP_HELPER_PLATFORM-}
    WEB_HOST_PROFILE_DIR: ${WEB_HOST_PROFILE_DIR-./whatsapp-web}
    WEB_HISTORY_SYNC_ENABLED: ${WEB_HISTORY_SYNC_ENABLED-true}
    BRIDGE_STARTUP_TIMEOUT_SECONDS: ${BRIDGE_STARTUP_TIMEOUT_SECONDS-60}
  volumes:
    - .:/workspace
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  mock-cloud:
    container_name: claw-insurance-mock-cloud
    <<: *backend-common
    entrypoint: ["python3", "-m", "nanobot.demo.mock_cloud"]
    command: ["--port", "5050"]
    environment:
      MOCK_DB_API_KEY: demo-db-key
      MOCK_INTERVIEW_API_KEY: demo-interview-key
      MOCK_AI_API_KEY: demo-ai-key
    restart: unless-stopped
    ports:
      - "5050:5050"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *backend-common
    command: ["--api-port", "3456"]
    depends_on:
      mock-cloud:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3456:3456"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3456/api/status', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-frontend:
    container_name: nanobot-frontend
    build:
      context: "./frontend"
      dockerfile: Dockerfile
    depends_on:
      nanobot-gateway:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"
